<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Book Demand Predictor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">📚 Book Demand Predictor</a>
    <nav>
      <a href="{{ url_for('index') }}">Catalogue</a>
      <a href="{{ url_for('dashboard') }}">Admin dashboard</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Content-based filtering (TF-IDF + cosine similarity) and Ridge-regression
    demand forecasting over a seeded synthetic catalogue.
  </footer>
</body>
</html>
